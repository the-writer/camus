<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="x-ua-compatible" content="ie=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="description" content="{{ site.description }}"/>
    <title>搜索 - {{ site.title }}</title>
    <link rel="icon" href="{{ with_prefix("/favicon.ico") }}"/>
    <link rel="stylesheet" href="{{ with_prefix("/css/tomato.css") }}"/>
    <link rel="stylesheet" href="{{ with_prefix("/css/style.css") }}"/>
    <script>
        (function () {
            try {
                var mode = localStorage.getItem("tomato-theme");
                if (mode !== "dark" && mode !== "light" && mode !== "auto") {
                    mode = "auto";
                }
                var effective = mode === "auto"
                    ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
                    : mode;
                document.documentElement.setAttribute("data-theme", effective);
                document.documentElement.setAttribute("data-theme-mode", mode);
            } catch (e) {
            }
        })();
    </script>
    <style>
        .tm-search-form {
            position: relative;
            display: flex;
        }

        #search-input {
            flex: 1;
            min-width: 0;
            padding: 9px 44px 9px 14px;
            border: 1px solid var(--tm-border);
            border-radius: var(--tm-radius);
            background: var(--tm-panel);
            color: var(--tm-text);
            font: inherit;
            font-size: 0.9rem;
        }

        #search-input:focus {
            outline: none;
            border-color: var(--tm-accent);
        }

        #search-regex {
            position: absolute;
            top: 50%;
            right: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            padding: 0;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--tm-text-faint);
            font: inherit;
            cursor: pointer;
            transform: translateY(-50%);
        }

        #search-regex:hover,
        #search-regex.is-active {
            color: var(--tm-accent);
            background: var(--tm-accent-soft);
        }

        .tm-regex-icon {
            width: 15px;
            height: 15px;
        }

        .tm-search-panel {
            min-height: 240px;
        }

        #search-status {
            margin: 0 0 8px;
            color: var(--tm-text-faint);
            font-size: 0.82rem;
        }

        #search-results {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .search-result {
            padding: 14px 0;
            border-bottom: 1px solid var(--tm-border);
        }

        .search-result:last-child {
            border-bottom: none;
        }

        .search-result a {
            display: block;
            color: var(--tm-text);
            text-decoration: none;
            font-size: 1rem;
        }

        .search-result a:hover {
            color: var(--tm-accent);
        }

        .search-result-url {
            display: block;
            margin-top: 4px;
            color: var(--tm-text-faint);
            font-size: 0.78rem;
            word-break: break-all;
        }

        .search-result-empty {
            padding: 28px 0;
            color: var(--tm-text-faint);
            font-size: 0.86rem;
            text-align: center;
        }
    </style>
</head>
<body class="tomato" data-camus-theme="{{ render.theme_name }}">

<button id="tm-menu" class="tm-menu-btn" type="button" aria-label="切换章节目录" title="切换章节目录">☰</button>

<aside class="tm-sidebar" id="tm-sidebar">
    <header class="tm-book{% if length(site.logo) > 0 %} tm-book-cover{% endif %}">
        {% if length(site.logo) > 0 %}
        <img
             class="tm-book-cover-img" alt="{{ site.title }}" data-cover="{{ site.logo }}" data-prefix="{{ path_prefix }}"/>
        {% endif %}
        <div class="tm-book-info">
            <h1>{{ site.title }}</h1>
            {% if length(site.subtitle) > 0 %}<div class="tm-book-sub" data-tip="{{ site.subtitle }}">{{ site.subtitle }}</div>{% endif %}
        </div>
    </header>

    <div class="tm-toc-head">
        <span class="tm-toc-title">目录 <span class="tm-count">{{ length(chapters) }}</span></span>
        <div class="tm-toc-actions">
            <button id="tm-volume-btn" class="tm-toc-action" type="button" aria-haspopup="true" aria-expanded="false" hidden>
                分卷 <span class="tm-caret" aria-hidden="true">⌄</span>
            </button>
            <button id="tm-month-btn" class="tm-toc-action" type="button" aria-haspopup="true" aria-expanded="false" hidden>
                时间 <span class="tm-caret" aria-hidden="true">⌄</span>
            </button>
            <button id="tm-reverse-btn" class="tm-toc-action" type="button" aria-pressed="false">倒序</button>
            <button id="tm-index-btn" class="tm-toc-action" type="button" aria-pressed="false">序号</button>
            <a id="tm-search-btn" class="tm-toc-action" href="{{ path_prefix }}/search.html" aria-label="搜索" title="搜索"><span class="tm-search-icon" style="-webkit-mask-image: url('{{ with_prefix("/icons/search.svg") }}'); mask-image: url('{{ with_prefix("/icons/search.svg") }}');"></span></a>
        </div>
        <div id="tm-volume-menu" class="tm-volume-menu" hidden></div>
        <div id="tm-month-menu" class="tm-volume-menu" hidden></div>
    </div>

    <nav class="tm-chapters" id="tm-chapters" aria-label="章节列表">
        {% for chapter in chapters %}
        <a class="tm-chapter{% if chapter.current %} tm-current{% endif %}"
           href="{{ chapter.path }}"
           data-volume="{{ chapter.volume }}"
           data-volume-key="{{ chapter.volume_key }}"
           data-write-time="{{ chapter.write_time }}"
           data-tip="{{ chapter.title }}"><span class="tm-chapter-title">{{ chapter.title }}</span></a>
        {% endfor %}
    </nav>

    <footer class="tm-sidebar-footer">
        <span class="tm-footer-links">
            <a href="{{ path_prefix }}/">首页</a> /
            <a href="{{ path_prefix }}/stats.html">统计</a> /
            <a href="{{ path_prefix }}/friends.html">友链</a> /
            <a href="{{ path_prefix }}/search.html">搜索</a>
        </span>
        <span class="tm-footer-version">v{{ build.version }}</span>
    </footer>
</aside>

<div class="tm-overlay" id="tm-overlay"></div>

<aside class="tm-tools" aria-label="阅读设置">
    <button id="tm-theme" class="tm-tool" type="button" aria-pressed="false" title="切换主题（自动 / 白天 / 夜间）">
        <span id="tm-theme-icon" aria-hidden="true">◐</span>
        <span id="tm-theme-label" class="tm-tool-label">自动</span>
    </button>
    <div class="tm-font">
        <button id="tm-font-plus" class="tm-font-btn" type="button" aria-label="增大字号">A+</button>
        <input id="tm-font-range" class="tm-font-range" type="range" min="14" max="40" step="1" value="14"
               aria-label="字号"/>
        <button id="tm-font-minus" class="tm-font-btn" type="button" aria-label="减小字号">A-</button>
    </div>
</aside>

<main class="tm-main">
    <div class="tm-reader">
        <header class="tm-reader-head">
            <h1>搜索</h1>
        </header>

        <form id="search-form" class="tm-search-form" role="search">
            <input id="search-input" type="search" placeholder="输入关键词" autocomplete="off" autofocus/>
            <button id="search-regex" type="button" aria-pressed="false" aria-label="使用正则表达式" title="使用正则表达式"><span class="tm-search-icon tm-regex-icon" style="-webkit-mask-image: url('{{ with_prefix("/icons/regex.svg") }}'); mask-image: url('{{ with_prefix("/icons/regex.svg") }}');"></span></button>
        </form>

        <div class="tm-panel tm-search-panel">
            <p id="search-status"></p>
            <ul id="search-results"><li class="search-result-empty">输入关键词开始搜索</li></ul>
        </div>
    </div>
</main>

<script>window.CAMUS_SEARCH_URL = "{{ with_prefix("/search.gz") }}";</script>
<script src="{{ with_prefix("/js/onload.js") }}"></script>
<script src="{{ with_prefix("/js/tomato.js") }}"></script>
<script src="{{ with_prefix("/js/search.js") }}"></script>
</body>
</html>
